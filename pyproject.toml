[project]
name = "comptes-familiaux"
version = "0.1.0"
description = "Application locale d'analyse des finances familiales"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "--strict-markers"
markers = [
  "unit: tests unitaires sans IO externe",
  "integration: tests d'integration avec SQLite temporaire",
  "contract: tests des contrats HTTP",
  "golden: tests de resultats exacts sur donnees synthetiques",
  "opt_in_real_data: tests locaux opt-in sur donnees reelles",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]
include = ["backend/**/*.py", "pyproject.toml"]
extend-exclude = ["backend/tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
files = ["backend/app"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["uvicorn.*", "alembic.*"]
ignore_missing_imports = true
