      family_current: {role: current}
    period: {start: '2026-01-01', end: '2026-01-31', kind: calendar_month}
    coverage_status: complete
    coverage_windows:
      - {account_id: family_current, covered_from: '2026-01-01', covered_through: '2026-01-31'}
    transactions:
      - {id: S01, account_id: family_current, booked_on: '2026-01-02', amount_cents: 300000, flow_kind: income_recurring, allocations: [{amount_cents: 300000, flow_kind: income_recurring, category_id: income_salary_a, origin: manual, decision: confirmed}]}
